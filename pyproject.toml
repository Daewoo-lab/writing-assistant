[project]
name = "writing-assistant"
version = "0.1.0"
description = "Brief -> drafted document generator. Human downloads, edits and submits it himself."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_assistant"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
strict = true
packages = ["writing_assistant"]
