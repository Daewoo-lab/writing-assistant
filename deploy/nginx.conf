server {
    listen 80;
    server_name _;

    root /srv/web;
    index index.html;

    location = /payme/callback {
        proxy_pass http://api:8000/payme/callback;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
